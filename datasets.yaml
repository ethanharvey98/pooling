# Dataset Registry — HPC paths

oasis3_mri:
  description: "OASIS-3 brain MRI (T1w, T2w). Binary Alzheimer's classification."
  modality: MRI
  numpy_dir: /cluster/tufts/hugheslab/datasets/OASIS-3_MRI_numpy
  labels_csv: /cluster/tufts/hugheslab/datasets/OASIS-3_MRI_numpy/labels.csv
  seeds: [1001, 2001, 3001]
  encoded:
    ViT_B_16:
      path: /cluster/tufts/hugheslab/eharve06/encoded_OASIS-3_MRI/ViT_B_16/seed={seed}
      embed_dim: 768
    ConvNeXt_Tiny:
      path: /cluster/tufts/hugheslab/eharve06/encoded_OASIS-3_MRI/ConvNeXt_Tiny/seed={seed}
      embed_dim: 768
    MedSAM:
      path: /cluster/tufts/hugheslab/eharve06/encoded_OASIS-3_MRI/MedSAM/seed={seed}
      embed_dim: 256
    3DINO_ViT:
      path: /cluster/tufts/hugheslab/eharve06/encoded_OASIS-3_MRI/3DINO_ViT/seed={seed}
      embed_dim: 1024

oasis3_ct:
  description: "OASIS-3 head CT. Binary Alzheimer's classification."
