kpsc_mri:
  description: "KPSC 800 brain MRI (T1w+T2w), 11 sites. Labels: idCBI, idWMD. Site-based splits. IRB-required."
  modality: MRI
  numpy_dir: /cluster/tufts/hugheslabkp/data_irb_required/KPSC_MRI_800_numpy
  labels_csv: /cluster/tufts/hugheslabkp/data_irb_required/KPSC_MRI_800_numpy/labels.csv
  encoded:
    ViT_B_16:
      path: /cluster/tufts/hugheslabkp/data_irb_required/encoded_KPSC_MRI_800/ViT_B_16/{split_spec}
      embed_dim: 768
    ConvNeXt_Tiny:
      path: /cluster/tufts/hugheslabkp/data_irb_required/encoded_KPSC_MRI_800/ConvNeXt_Tiny/{split_spec}
