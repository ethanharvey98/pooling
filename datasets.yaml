      embed_dim: 768
    MedSAM:
      path: /cluster/tufts/hugheslab/eharve06/encoded_OASIS-3_CT/MedSAM/seed={seed}
      embed_dim: 256

rsna_full:
  description: "Full RSNA ICH dataset (~21,744 CT scans). Binary hemorrhage detection. Scripts on rsna-ich branch."
  modality: CT
  numpy_dir: /cluster/tufts/hugheslab/datasets/RSNA_numpy
  labels_csv: /cluster/tufts/hugheslab/datasets/RSNA/labels.csv
  seeds: [1001, 2001, 3001]
  encoded:
    ViT_B_16:
      path: /cluster/tufts/hugheslab/dloevl01/encoded_RSNA/ViT_B_16/seed={seed}
      embed_dim: 768

rsna_1149:
  description: "Curated 1,149-scan RSNA ICH subset. Binary hemorrhage detection. Scripts on rsna-ich branch."
  modality: CT
  numpy_dir: /cluster/tufts/hugheslab/dloevl01/datasets/RSNA/RSNA_ICH_numpy
  labels_csv: notebooks/rsna_ich_subset_1149_complete.csv  # on rsna-ich branch
  seeds: [1001, 2001, 3001]
  encoded:
    ViT_B_16:
